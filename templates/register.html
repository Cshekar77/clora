{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="box"><h3 class="sec-title">Create account</h3>
<form method="post"><label class="form-label">Name</label><input name="name" class="form-control mb-2" required>
<label class="form-label">Email</label><input name="email" type="email" class="form-control mb-2" required>
<label class="form-label">Password (min 6 characters)</label><input name="password" type="password" class="form-control mb-3" required>
<button class="btn btn-gold w-100">Create account</button></form><hr><p class="small">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div></div>{% endblock %}
